# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: trailing-whitespace
        exclude: ^data/
    -   id: end-of-file-fixer
        exclude: ^data/
    -   id: check-yaml
    -   id: check-added-large-files
        args: ['--maxkb=2000']

# black, flake8 and isort run from the active environment so they use the
# versions pinned in requirements/dev-requirements.txt
-   repo: local
    hooks:
    -   id: black
        name: black
        entry: black
        language: system
        types_or: [python, pyi]
        require_serial: true
        exclude: migrations

    -   id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
        require_serial: true
        exclude: migrations

    -   id: isort
        name: isort (python)
        entry: isort
        language: system
        types_or: [cython, pyi, python]
        require_serial: true
        args: ['--filter-files']
